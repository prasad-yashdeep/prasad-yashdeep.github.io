<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Celebrity Heads Up!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { touch-action: manipulation; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.container {
  text-align: center;
  padding: 1.5rem;
  width: 100%;
  max-width: 500px;
}
h1 {
  font-size: 1.6rem;
  margin-bottom: 0.3rem;
  background: linear-gradient(90deg, #f7971e, #ffd200);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  color: #aaa;
  font-size: 0.85rem;
  margin-bottom: 1.5rem;
}
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 2.5rem 1.5rem;
  margin-bottom: 1.5rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card:active { transform: scale(0.97); }
.celebrity-name {
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  word-break: break-word;
}
.celebrity-name.hidden-name {
  font-size: 1.1rem;
  color: #888;
  font-weight: 400;
}
.timer-container { margin-bottom: 1.5rem; }
.timer {
  font-size: 3.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #00d2ff;
  text-shadow: 0 0 20px rgba(0,210,255,0.3);
}
.timer.warning { color: #ff6b6b; text-shadow: 0 0 20px rgba(255,107,107,0.4); animation: pulse 0.5s infinite; }
.timer-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  margin-top: 0.8rem;
  overflow: hidden;
}
.timer-bar-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #00d2ff, #f7971e);
  border-radius: 3px;
  transition: width 1s linear;
}
.controls {
  display: flex;
  gap: 1rem;
  justify-content: center;
}
button {
  padding: 1rem 2rem;
  border: none;
  border-radius: 14px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:active { transform: scale(0.93); }
.btn-next {
  background: linear-gradient(135deg, #f7971e, #ffd200);
  color: #1a1a2e;
  flex: 1;
  max-width: 200px;
}
.btn-reset {
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}
.score {
  margin-top: 1.5rem;
  font-size: 1.1rem;
  color: #aaa;
}
.score span { color: #ffd200; font-weight: 700; font-size: 1.4rem; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
@keyframes slideIn { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }
.celebrity-name.animate { animation: slideIn 0.25s ease; }
.timesup { color: #ff6b6b; font-size: 1.8rem !important; font-weight: 700 !important; }
</style>
</head>
<body>
<div class="container">
  <h1>🌟 Celebrity Heads Up!</h1>
  <p class="subtitle">Tap the card or Next to reveal • Describe without saying the name!</p>
  
  <div class="timer-container">
    <div class="timer" id="timer">60</div>
    <div class="timer-bar"><div class="timer-bar-fill" id="timerBar"></div></div>
  </div>
  
  <div class="card" id="card">
    <div class="celebrity-name hidden-name" id="celeb">Tap to start! 👆</div>
  </div>
  
  <div class="controls">
    <button class="btn-next" id="btnNext">Next ➡️</button>
    <button class="btn-reset" id="btnReset">Reset 🔄</button>
  </div>
  
  <div class="score">Score: <span id="score">0</span></div>
</div>

<script>
const celebrities = [
  // Actors
  "Leonardo DiCaprio","Tom Cruise","Brad Pitt","Johnny Depp","Will Smith",
  "Robert Downey Jr.","Keanu Reeves","Morgan Freeman","Denzel Washington","Tom Hanks",
  "Ryan Reynolds","Chris Hemsworth","Chris Pratt","Chris Evans","Dwayne Johnson",
  "Vin Diesel","Jason Momoa","Zac Efron","Ryan Gosling","Jake Gyllenhaal",
  "Matt Damon","Ben Affleck","Hugh Jackman","Daniel Craig","Joaquin Phoenix",
  "Adam Sandler","Jim Carrey","Eddie Murphy","Samuel L. Jackson","Al Pacino",
  "Robert De Niro","Jack Nicholson","Tom Holland","Timothée Chalamet","Pedro Pascal",
  "Oscar Isaac","Idris Elba","Michael B. Jordan","Chadwick Boseman","Benedict Cumberbatch",
  // Actresses
  "Scarlett Johansson","Jennifer Lawrence","Margot Robbie","Gal Gadot","Emma Watson",
  "Anne Hathaway","Natalie Portman","Angelina Jolie","Sandra Bullock","Julia Roberts",
  "Meryl Streep","Cate Blanchett","Nicole Kidman","Charlize Theron","Halle Berry",
  "Zendaya","Sydney Sweeney","Florence Pugh","Ana de Armas","Millie Bobby Brown",
  "Emma Stone","Saoirse Ronan","Lupita Nyong'o","Viola Davis","Reese Witherspoon",
  // Musicians
  "Taylor Swift","Beyoncé","Rihanna","Ariana Grande","Lady Gaga",
  "Billie Eilish","Dua Lipa","Selena Gomez","Shakira","Adele",
  "Nicki Minaj","Cardi B","Doja Cat","SZA","Olivia Rodrigo",
  "Drake","The Weeknd","Post Malone","Travis Scott","Bad Bunny",
  "Kanye West","Jay-Z","Eminem","Snoop Dogg","Kendrick Lamar",
  "Ed Sheeran","Harry Styles","Justin Bieber","Bruno Mars","Lil Nas X",
  "Ice Spice","Megan Thee Stallion","21 Savage","Future","Metro Boomin",
  "Frank Ocean","Tyler the Creator","Mac Miller","Juice WRLD","XXXTentacion",
  "Lana Del Rey","Miley Cyrus","Katy Perry","Pink","Lizzo",
  // Sports
  "Cristiano Ronaldo","Lionel Messi","Neymar","Kylian Mbappé","LeBron James",
  "Stephen Curry","Michael Jordan","Kobe Bryant","Shaquille O'Neal","Kevin Durant",
  "Virat Kohli","MS Dhoni","Sachin Tendulkar","Roger Federer","Rafael Nadal",
  "Novak Djokovic","Serena Williams","Usain Bolt","Conor McGregor","Mike Tyson",
  "Tom Brady","Floyd Mayweather","Tiger Woods","Lewis Hamilton","Max Verstappen",
  // TV / Streaming
  "Kim Kardashian","Kylie Jenner","Oprah Winfrey","Ellen DeGeneres","Jimmy Fallon",
  "Gordon Ramsay","Simon Cowell","Bear Grylls","David Attenborough","Steve Harvey",
  "Kevin Hart","Dave Chappelle","Trevor Noah","John Oliver","Joe Rogan",
  // Tech / Business
  "Elon Musk","Jeff Bezos","Mark Zuckerberg","Bill Gates","Steve Jobs",
  "Tim Cook","Jensen Huang","Sam Altman","MrBeast","PewDiePie",
  // Bollywood / Indian
  "Shah Rukh Khan","Salman Khan","Aamir Khan","Amitabh Bachchan","Ranveer Singh",
  "Ranbir Kapoor","Hrithik Roshan","Akshay Kumar","Deepika Padukone","Priyanka Chopra",
  "Alia Bhatt","Katrina Kaif","Kareena Kapoor","Aishwarya Rai","Anushka Sharma",
  // K-Pop / Asian
  "BTS Jungkook","BTS V","Blackpink Lisa","Blackpink Jennie","Jackie Chan",
  // Historical / Iconic
  "Michael Jackson","Elvis Presley","Marilyn Monroe","Princess Diana","Muhammad Ali",
  "Bob Marley","Freddie Mercury","John Lennon","David Bowie","Whitney Houston",
  "Tupac","Notorious B.I.G.","Prince","Amy Winehouse","Kurt Cobain",
  // Miscellaneous
  "Jack Black","Will Ferrell","Seth Rogen","Jonah Hill","Danny DeVito",
  "Nicolas Cage","Keanu Reeves","Arnold Schwarzenegger","Sylvester Stallone","Bruce Lee",
  "Chuck Norris","Dwayne 'The Rock' Johnson","John Cena","The Undertaker","Stone Cold Steve Austin"
];

// Fisher-Yates shuffle — guaranteed no repeats until entire list is used
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

// Track used names across resets within same page session
var used = new Set();
var queue = [];

function getNext() {
  if (queue.length === 0) {
    // If we've used everything, reset
    if (used.size >= celebrities.length) used.clear();
    var available = celebrities.filter(function(c) { return !used.has(c); });
    queue = shuffle(available);
  }
  var name = queue.pop();
  used.add(name);
  return name;
}

var score, timeLeft, timerInterval, gameStarted, gameOver;

function init() {
  score = 0; timeLeft = 60;
  timerInterval = null; gameStarted = false; gameOver = false;
  document.getElementById('timer').textContent = '60';
  document.getElementById('timer').classList.remove('warning');
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('score').textContent = '0';
  var el = document.getElementById('celeb');
  el.textContent = 'Tap to start! 👆';
  el.className = 'celebrity-name hidden-name';
}

function startTimer() {
  if (timerInterval) return;
  gameStarted = true;
  timerInterval = setInterval(function() {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    document.getElementById('timerBar').style.width = ((timeLeft/60)*100) + '%';
    if (timeLeft <= 10) document.getElementById('timer').classList.add('warning');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      gameOver = true;
      var el = document.getElementById('celeb');
      el.textContent = "⏰ Time's up! Score: " + score;
      el.className = 'celebrity-name timesup';
    }
  }, 1000);
}

function revealNext() {
  if (gameOver) return;
  if (!gameStarted) startTimer();
  if (gameStarted && document.getElementById('celeb').className.indexOf('hidden-name') === -1 
      && document.getElementById('celeb').textContent !== '') {
    score++;
    document.getElementById('score').textContent = score;
  }
  var el = document.getElementById('celeb');
  el.textContent = getNext();
  el.className = 'celebrity-name animate';
  setTimeout(function() { el.classList.remove('animate'); }, 250);
}

function resetGame() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  init();
}

document.getElementById('card').addEventListener('click', revealNext);
document.getElementById('btnNext').addEventListener('click', revealNext);
document.getElementById('btnReset').addEventListener('click', resetGame);

init();
</script>
</body>
</html>
